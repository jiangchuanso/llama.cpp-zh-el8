; llama.cpp server - model presets
; Usage:  llama-server --models-preset ./models.ini
;
; Sampling params below are each model's OFFICIAL recommendation, gathered from
; the model cards on hf-mirror.com (Hugging Face mirror) and modelscope.cn.
; Only values that DIFFER from llama.cpp defaults are written.
; llama.cpp defaults (omitted when equal): temp 0.80 / top-k 40 / top-p 0.95 /
;   min-p 0.05 / repeat-penalty 1.00.
; chat-template is omitted -> the GGUF built-in template is used automatically.
;
; dspark = DSpark speculative-decoding DRAFT model (LiquidAI / OpenBMB),
; ENABLED below via model-draft + spec-type = draft-dspark.
; spec-draft-n-max follows the official DSpark block size:
;   LFM2.5-DSpark  = 9   (per LFM2.5-2.6B-DSpark card, block size 9)
;   MiniCPM5-DSpark = 7  (per MiniCPM5-2B-DSpark card, block size 7)
; llama.cpp default spec-draft-n-max is 3, so these are explicit overrides.
;
; spec-draft-n-min (default 0) and spec-draft-p-split (default 0.10) are NOT
; overridden: llama.cpp's own dspark examples (docs/speculative.md,
; examples/speculative-simple) only set spec-draft-n-max and leave these at
; their defaults, so keeping the defaults IS the official recommendation.
; They are shown as comments under each dspark section for reference.
; =============================================================================
version = 1

; ============================ LFM2.5 (LiquidAI) ============================
; official: temp / top_k / repetition_penalty (top_p not specified)
; DSpark enabled, spec-draft-n-max = 9

[LFM2.5-1.2B-Instruct-Q8_0]
model = LFM2.5-1.2B-Instruct-Q8_0.gguf
temp = 0.1
top-k = 50
repeat-penalty = 1.05
model-draft = dspark-LFM2.5-1.2B-Instruct-Q8_0.gguf
spec-type = draft-dspark
spec-draft-n-max = 9
; spec-draft-n-min = 0      ; llama.cpp default (official dspark examples don't override)
; spec-draft-p-split = 0.10 ; llama.cpp default (official dspark examples don't override)

[LFM2.5-2.6B-Q8_0]
model = LFM2.5-2.6B-Q8_0.gguf
temp = 0.1
top-k = 50
repeat-penalty = 1.1
model-draft = dspark-LFM2.5-2.6B-Q8_0.gguf
spec-type = draft-dspark
spec-draft-n-max = 9
; spec-draft-n-min = 0      ; llama.cpp default (official dspark examples don't override)
; spec-draft-p-split = 0.10 ; llama.cpp default (official dspark examples don't override)

[LFM2.5-8B-A1B-Q8_0]
model = LFM2.5-8B-A1B-Q8_0.gguf
temp = 0.2
top-k = 80
repeat-penalty = 1.05
model-draft = dspark-LFM2.5-8B-A1B-Q8_0.gguf
spec-type = draft-dspark
spec-draft-n-max = 9
; spec-draft-n-min = 0      ; llama.cpp default (official dspark examples don't override)
; spec-draft-p-split = 0.10 ; llama.cpp default (official dspark examples don't override)

; ============================ MiniCPM5 (OpenBMB) ============================
; 2B: Think only, temp 1.0 / top_p 0.95 ; 1B: Think 0.9 / No-think 0.7
; 2B DSpark enabled, spec-draft-n-max = 7

[MiniCPM5-2B-Q8_0]
model = MiniCPM5-2B-Q8_0.gguf
temp = 1.0
model-draft = dspark-MiniCPM5-2B-Q8_0.gguf
spec-type = draft-dspark
spec-draft-n-max = 7
; spec-draft-n-min = 0      ; llama.cpp default (official dspark examples don't override)
; spec-draft-p-split = 0.10 ; llama.cpp default (official dspark examples don't override)

[MiniCPM5-1B-Q8_0]
model = MiniCPM5-1B-Q8_0.gguf
temp = 0.7

; ============================ Qwen3-ASR (Qwen) =============================
; official decoding = greedy (temperature ~ 0)

[Qwen3-ASR-0.6B-Q8_0]
model = Qwen3-ASR-0.6B-Q8_0.gguf
mmproj = mmproj-Qwen3-ASR-0.6B-Q8_0.gguf
temp = 0

; ============================ Qwen3 / Qwen3.8 ==============================
; Qwen3-4B: temp 0.6 / top_p 0.95 / top_k 20 / min_p 0
; Qwen3.8  : temp 1.0 / top_p 0.95 / top_k 20 / min_p 0

[Qwen3-4B-Q8_0]
model = Qwen3-4B-Q8_0.gguf
temp = 0.6
top-k = 20
min-p = 0.0

[Qwen3.8-4B-Q8_0]
model = Qwen3.8-4B-Q8_0.gguf
temp = 1.0
top-k = 20
min-p = 0.0

