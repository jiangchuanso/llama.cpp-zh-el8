name: Build CUDA backend packages

# Fork-only workflow. It builds the EL8 (Kylin V10 compatible) CUDA backend of
# ggml and repackages it into an add-on RPM for llama-cpu, together with the few
# CUDA runtime libraries the backend links so that the host only needs the NVIDIA
# driver. Nothing here is upstream, so it can never conflict when merging
# upstream/master.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  cuda:
    name: cuda / ${{ matrix.dist }}
    # One library per architecture: the CUDA runtime shipped inside the package
    # is native code, so an aarch64 host cannot load the x86_64 backend. The
    # aarch64 build covers servers with an NVIDIA card, same as the x86_64 one.
    strategy:
      matrix:
        include:
          - build: 'x64'
            os: ubuntu-24.04
            dist: 'el8-x64'
            # NVIDIA publishes two Linux runfiles: x86_64 and ARM SBSA (server)
            runfile: 'linux'
          - build: 'arm64'
            os: ubuntu-24.04-arm
            dist: 'el8-arm64'
            runfile: 'linux_sbsa'
    runs-on: ${{ matrix.os }}
    # The CPU packages are built in almalinux:8 and this backend ends up loaded
    # into the very same process, so it has to come from the same OS line: EL8
    # keeps it on glibc 2.28 and on the libstdc++ that llama-cpu bundles. The
    # CUDA toolkit therefore comes from NVIDIA's official Linux runfile (the
    # universal EL8-compatible installer) instead of an nvidia/cuda image or the
    # rhel8 dnf repository: those images are only published for Ubuntu, UBI8 and
    # newer RHEL lines, the el8 line is not among them.
    container: almalinux:8

    env:
      # CUDA 13 runfile. 13.0.0 is the 13.x floor and needs the least-new driver
      # (>= 580), so it fits the widest range of GPU hosts. The runfile name
      # embeds the bundled driver version, so CUDA_RUN_DRIVER must match the
      # NVIDIA archive: 13.0.0 GA bundles 580.65.06. A mismatch 404s the
      # download (the step prints a hint).
      CUDA_VERSION: "13.0.0"
      CUDA_RUN_DRIVER: "580.65.06"

    steps:
      # almalinux:8 has no git. Without it actions/checkout falls back to a REST
      # archive download (no .git dir) and the later `git rev-list` fails.
      - name: Install git
        run: dnf -y install --setopt=install_weak_deps=False git

      # fetch-depth 0: the release number of the RPM is `git rev-list --count HEAD`
      # and has to match the llama-cpu RPM built from the same commit
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: System Dependencies (EL8 / dnf)
        run: |
          # gcc-toolset-14 is the compiler the EL8 CPU build uses, and CUDA 13
          # takes GCC 14 as host compiler, so nvcc accepts it as-is
          dnf -y install --setopt=install_weak_deps=False \
            gcc-toolset-14 binutils make cmake which tar
          # the PATH written here reaches this job's step environment but did not
          # put the toolset on the PATH cmake searched (see the build step), so
          # the compiler is also named by path there; CC/CXX stay for the tools
          # that read them
          echo "PATH=/opt/rh/gcc-toolset-14/root/usr/bin:$PATH" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
          # assert the toolset landed and runs, so a bad install fails here and
          # not three steps later as cmake's "Could not find compiler set in
          # environment variable CC". `test -x` first on purpose: `gcc --version
          # | head -1` exits 0 even when gcc is missing, a pipeline reporting the
          # status of its last command
          test -x /opt/rh/gcc-toolset-14/root/usr/bin/gcc
          /opt/rh/gcc-toolset-14/root/usr/bin/gcc --version
          # recorded because FindCUDAToolkit is version sensitive: if the cmake
          # coming from the EL8 repos is too old to parse CUDA 13, the failure
          # shows up as "CUDA Toolkit not found" three steps later
          cmake --version | head -1

      # CUDA 13 comes from NVIDIA's official Linux runfile instead of the dnf
      # repository: the runfile is the universal EL8-compatible installer and is
      # the same .run the host uses for the driver (x86_64 and ARM SBSA are two
      # separate runfiles, picked by the matrix). Only the toolkit is needed
      # here (--toolkit skips the driver): it provides nvcc plus the runtime
      # libraries, and the ones the backend links are copied into the package
      # below. What the host installs itself is only the driver, which no RPM can
      # ship (see packaging/rpm/README.md). glibc stays at 2.28 because the
      # runfile targets RHEL 8.
      - name: CUDA Toolkit (official runfile, CUDA 13)
        run: |
          dnf -y install --setopt=install_weak_deps=False wget perl
          runfile="cuda_${CUDA_VERSION}_${CUDA_RUN_DRIVER}_${{ matrix.runfile }}.run"
          url="https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}/local_installers/${runfile}"
          if ! wget -q "$url"; then
            echo "error: cannot download $runfile - check CUDA_VERSION / CUDA_RUN_DRIVER against NVIDIA's archive"
            exit 1
          fi
          uname -m
          sh "${runfile}" --toolkit --silent --override \
            --installpath="/usr/local/cuda-${CUDA_VERSION%.*}"
          rm -f "${runfile}"
          # the runfile installs under /usr/local/cuda-<major>.<minor> and only
          # the /etc/profile.d snippet puts it on PATH, which a CI step never reads
          CUDA_HOME="/usr/local/cuda-${CUDA_VERSION%.*}"
          echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"
          "$CUDA_HOME/bin/nvcc" --version

      # Only ggml-cuda is built here: llama-server, the CPU backend and the
      # shared ggml-base library all come from the llama-cpu package, and
      # GGML_BACKEND_DL turns the backend into a module that llama-server finds
      # in its own directory at startup.
      - name: Build CUDA backend
        run: |
          # The compiler is named by path, not left to CC + PATH: this job's
          # container had /opt/rh/gcc-toolset-14/root/usr/bin first on PATH and a
          # working gcc inside it seven milliseconds earlier, yet cmake's first
          # probe still failed with "Could not find compiler set in environment
          # variable CC: gcc" - while the identical CC + PATH pair resolves fine
          # in build-cpu's ubuntu job. An absolute compiler takes PATH out of the
          # decision, and the two prints below record what PATH resolved to.
          echo "PATH=$PATH"
          command -v gcc || echo "gcc is not on PATH"
          cmake -B build \
            -DCMAKE_C_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/g++ \
            -DCMAKE_CUDA_HOST_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/g++ \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DCUDAToolkit_ROOT="$CUDA_HOME" \
            -DCMAKE_BUILD_RPATH='$ORIGIN' \
            -DCMAKE_SHARED_LINKER_FLAGS=-Wl,--disable-new-dtags \
            -DCMAKE_CUDA_ARCHITECTURES='120a-real;121a-real'
          # Blackwell only: every GPU these hosts have is sm_120 (RTX 50 series,
          # RTX Pro Blackwell), so the upstream default set is cut down to it.
          # That set also carries 75/80/86/89/90 for older cards, and each
          # architecture is compiled into every kernel template instance, so
          # dropping them is what keeps the build time and libggml-cuda.so small.
          # Consequence: on a pre-Blackwell card the backend finds no cubin and no
          # PTX to JIT, so it is not loaded and the server stays on the CPU.
          # 121a is kept because it costs one more pass and covers the other
          # Blackwell parts; there is no point in a *-virtual Blackwell entry,
          # PTX cannot JIT downwards to older cards anyway.
          # --disable-new-dtags makes the linker emit DT_RPATH instead of
          # DT_RUNPATH: only DT_RPATH is inherited along the dependency chain, so
          # it is what lets libcublas, loaded from /opt/llama-cpu/bin, find the
          # libcublasLt shipped next to it (cublas loads it at run time, it is
          # not a NEEDED entry). With DT_RUNPATH it would fall back to the system
          # loader paths and miss it.
          time cmake --build build --config Release --target ggml-cuda -j $(nproc)

      # The backend is loaded from /opt/llama-cpu/bin next to llama-server, so it
      # resolves its C++ runtime from that directory ($ORIGIN) and never from the
      # host. What it asks for must therefore stay within what llama-cpu ships:
      # EL8's glibc 2.28 and the EL8 libstdc++ that the CPU packages bundle.
      - name: Check runtime baseline
        run: |
          ldd --version | head -1
          echo "== dynamic section =="
          readelf -d build/bin/libggml-cuda.so | grep -E 'NEEDED|RPATH|RUNPATH'
          fail=0
          for sym in GLIBCXX_ CXXABI_; do
            n=$(strings -a build/bin/libggml-cuda.so | grep -oE "${sym}[0-9.]+" | sort -uV | tail -1)
            h=$(strings -a /usr/lib64/libstdc++.so.6 | grep -oE "${sym}[0-9.]+" | sort -uV | tail -1)
            echo "${sym} need='${n}' provided='${h}'"
            if [ -n "$n" ] && [ "$(printf '%s\n%s\n' "$n" "$h" | sort -V | tail -1)" != "$h" ]; then
              echo "error: llama-cpu bundles $h but the backend needs $n"; fail=1
            fi
          done
          max_ver=2.28
          dynsyms=$(objdump -T build/bin/libggml-cuda.so 2>/dev/null)
          if echo "$dynsyms" | grep -q GLIBC_PRIVATE; then
            echo "error: the backend references GLIBC_PRIVATE"; fail=1
          fi
          vers=$(echo "$dynsyms" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV)
          if [ -n "$vers" ] && [ "$(printf '%s\nGLIBC_%s\n' "$vers" "$max_ver" | sort -V | tail -1)" != "GLIBC_$max_ver" ]; then
            echo "error: the backend needs $(echo "$vers" | tail -1), above glibc $max_ver"; fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "backend stays within glibc $max_ver"

      # The backend ships together with the CUDA libraries it links, so the target
      # host only needs the NVIDIA driver: installing the whole toolkit (several
      # GB) for three files is not worth it. libcuda.so.1 stays out on purpose,
      # it comes from the driver and must never be bundled.
      - name: Collect the backend and the CUDA runtime
        run: |
          mkdir -p dist
          cp -a build/bin/libggml-cuda.so* dist/

          # Take the CUDA libraries straight from the backend's own NEEDED list
          # instead of a hardcoded list: a CUDA upgrade that renames or adds one
          # is then picked up on its own. A soname is a symlink, so the file it
          # points at is copied too. libcublasLt is not a NEEDED entry, cublas
          # loads it itself at run time, so it is added explicitly.
          cuda_lib="$CUDA_HOME/lib64"
          # a soname is a symlink, so the file it points at goes in as well
          ship() {
            for f in "$@"; do
              if [ ! -e "$f" ]; then
                echo "error: $f is needed but missing"
                exit 1
              fi
              cp -a "$f" dist/
              if [ -L "$f" ]; then
                cp -a "$(readlink -f "$f")" dist/
              fi
            done
          }
          # libcuda.so.1 is dropped here: it comes from the driver, not from the
          # toolkit, and bundling it would pin the host to one driver version
          ship $(readelf -d dist/libggml-cuda.so \
                 | sed -nE 's/.*\(NEEDED\).*\[(libcu.*|libnv.*)\]/\1/p' \
                 | grep -v '^libcuda\.so' | sort -u | sed "s|^|$cuda_lib/|")
          # libcublasLt is not a NEEDED entry: cublas loads it itself at run time
          ship "$cuda_lib"/libcublasLt.so.*
          ls -l dist
          # the CUDA runtime is the bulk of the package, print it so a size jump
          # shows up in the log instead of in the release assets
          du -sh dist
          du -sh dist/* | sort -h

          # Every library the backend links has to come from llama-cpu (ggml-base
          # and the C++ runtime), from this package, or from the driver. A name
          # outside those would be missing at run time, so fail here instead of
          # shipping a backend that cannot load.
          needs=$(readelf -d dist/libggml-cuda.so | sed -nE 's/.*\(NEEDED\).*\[(.*)\]/\1/p')
          echo "== needed =="
          echo "$needs"
          for lib in $needs; do
            case "$lib" in
              # ld-linux is the glibc loader, which CUDA 13's host link adds as
              # an explicit NEEDED; it comes from the base system like libc.so.6
              # and is never bundled
              libggml-base.so.*|libstdc++.so.*|libgomp.so.*|libgcc_s.so.*|libm.so.*|libc.so.*|libdl.so.*|libpthread.so.*|librt.so.*|ld-linux*.so.*)
                echo "from llama-cpu: $lib" ;;
              libcuda.so.*)
                echo "from the host NVIDIA driver: $lib" ;;
              libcu*.so.*|libnv*.so.*)
                # collected above, so it has to be here now
                if [ ! -e "dist/$lib" ]; then
                  echo "error: $lib is needed but was not collected"
                  exit 1
                fi
                echo "shipped with this package: $lib" ;;
              *)
                echo "error: $lib is neither shipped by llama-cuda nor expected on the host"
                exit 1 ;;
            esac
          done

      # Same shape as the llama-cpu RPM: version and release come from
      # CMakeLists.txt and the commit count, so that llama-cuda can require the
      # exact llama-cpu it was built against.
      - name: Build RPM
        run: |
          dnf -y install --setopt=install_weak_deps=False rpm-build
          set -e
          # checkout writes safe.directory into a temp HOME config, so later
          # git calls in the container fail with "dubious ownership"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          major=$(grep -oE 'set\(LLAMA_VERSION_MAJOR[[:space:]]+[0-9]+' CMakeLists.txt | grep -oE '[0-9]+$')
          minor=$(grep -oE 'set\(LLAMA_VERSION_MINOR[[:space:]]+[0-9]+' CMakeLists.txt | grep -oE '[0-9]+$')
          patch=$(grep -oE 'set\(LLAMA_VERSION_PATCH[[:space:]]+[0-9]+' CMakeLists.txt | grep -oE '[0-9]+$')
          version="$major.$minor.$patch"
          build_number=$(git rev-list --count HEAD)
          echo "packaging llama-cuda $version, build $build_number"

          mkdir -p rpmbuild/SOURCES/bin
          cp -a dist/. rpmbuild/SOURCES/bin/
          cp packaging/rpm/README.md rpmbuild/SOURCES/
          rpmbuild -bb packaging/rpm/llama-cuda.spec \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "llama_version $version" \
            --define "llama_build $build_number" \
            --define "dist .el8"

      # The dependency on llama-cpu is what keeps the backend and the server it
      # is loaded into on the same build; a typo here would be invisible until
      # install time. The bundled CUDA libraries must not show up as dependencies
      # either: they are in the package, so a soname requirement would demand a
      # second copy from the host and block installation.
      - name: Verify package metadata
        run: |
          set -e
          rpm="$(find rpmbuild/RPMS -name '*.rpm' | head -1)"
          echo "== requires =="
          rpm -qp --requires "$rpm"
          echo "== files =="
          rpm -qpl "$rpm"
          du -h "$rpm"
          if rpm -qp --requires "$rpm" | grep -E 'GLIBCXX_|CXXABI_|GOMP_|libcudart|libcublas'; then
            echo "error: package requires a bundled runtime library symbol or soname"
            exit 1
          fi
          if ! rpm -qp --requires "$rpm" | grep -qE '^llama-cpu[[:space:]]*='; then
            echo "error: package does not require llama-cpu"
            exit 1
          fi
          # the backend is a DL module, so it is shipped without a version
          # suffix (libggml-cuda.so, the way libggml-cpu-<variant>.so are in
          # llama-cpu); only normally linked libraries carry one, like the
          # libggml-base.so.0 llama-cpu ships. Accept both shapes.
          if ! rpm -qpl "$rpm" | grep -qE '/opt/llama-cpu/bin/libggml-cuda\.so($|\.)'; then
            echo "error: the ggml-cuda backend is not in the package"
            exit 1
          fi
          # the CUDA runtime is what makes the package work without a toolkit on
          # the host, so a missing library is a hard failure
          for lib in libcudart libcublas libcublasLt; do
            if ! rpm -qpl "$rpm" | grep -qE "/opt/llama-cpu/bin/${lib}\.so"; then
              echo "error: $lib is not in the package, the backend would not load"
              exit 1
            fi
          done
          # but the driver must never be bundled: it is the only thing the host
          # still has to install, and pinning it here would break other drivers
          if rpm -qpl "$rpm" | grep -qE '/opt/llama-cpu/bin/libcuda\.so'; then
            echo "error: libcuda.so.1 comes from the host driver and must not be bundled"
            exit 1
          fi
          # the package owns /opt/llama-cpu/bin and its doc dir and nothing else.
          # rpm drops build-id links under /usr/lib unless told not to, which
          # would be a file outside those two places
          if rpm -qpl "$rpm" | grep -qE '^/usr/lib/'; then
            echo "error: the package writes into /usr/lib:"
            rpm -qpl "$rpm" | grep -E '^/usr/lib/'
            exit 1
          fi

      - name: Upload CUDA backend
        uses: actions/upload-artifact@v6
        with:
          name: llama-cuda-${{ matrix.dist }}
          path: dist
          if-no-files-found: error

      - name: Upload RPM
        uses: actions/upload-artifact@v6
        with:
          name: llama-rpm-cuda-${{ matrix.dist }}
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
