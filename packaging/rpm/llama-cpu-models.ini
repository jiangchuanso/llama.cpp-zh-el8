#
# llama-server model presets (router mode)
# ========================================
#
# Referenced by --models-preset in /usr/lib/systemd/system/llama-server.service.
# This file MUST
# exist for the server to start; it is safe to leave it as-is.
#
# Models are discovered from --models-dir (/var/lib/llama-cpu/models): each
# .gguf file becomes a model whose id is the file name without the .gguf
# extension. Requests pick a model through the "model" field:
#
#   curl ... -d '{"model": "Qwen3-8B-Q8_0", "messages": [...]}'
#
# Sections below override the command-line defaults per model. Keys are CLI
# arguments without the leading dashes, e.g. --ctx-size 8192 becomes
# "ctx-size = 8192". A section that does not match a discovered model needs
# its own "model = PATH" key. See /usr/share/doc/llama-cpu/README.md.
#

version = 1

[*]
; Global defaults applied to every model. Command-line arguments win over
; these values.
;
; Quantize the KV cache to 8-bit: cuts KV memory ~2x vs the default f16, so
; you fit longer contexts / more concurrent requests in the same RAM. Quality
; impact is negligible for q8_0.
; NOTE: a quantized V cache REQUIRES flash attention (see llama-context.cpp:
; a quantized V cache forces flash_attn on). We enable flash-attn explicitly
; so the requirement is always satisfied and the server never refuses to start.
cache-type-k  = q8_0
cache-type-v  = q8_0
flash-attn    = true

;
; ctx-size      = 8192
;
; Thread counts. Left unset llama-server uses every logical core, which is a
; bad default on many-core hosts: a 128-core Phytium S5000C generates 32.5 t/s
; with 8 threads but only 2.3 t/s with 128. The optimum is per-CPU rather than
; per-architecture, so measure it on this host rather than trusting the default:
;
;   threads       (generation)    llama-bench -m /var/lib/llama-cpu/models/<model>.gguf -p 0   -n 128 -t 1,2,4,8,16,32,64 -r 3 -o md
;   threads-batch (prompt phase)  llama-bench -m /var/lib/llama-cpu/models/<model>.gguf -p 512 -n 0   -t 1,2,4,8,16,32,64 -r 3 -o md
;
; llama-bench has a single -t for both phases, so -p 0 / -n 0 isolates them.
; Write the two winners below (or per model). Each model runs as its own child
; process, so the counts multiply by the number of concurrently loaded models
; (--models-max, default 4). llama-cpu.spec substitutes the two placeholders
; below at build time; the value is the same for every architecture.
threads       = @THREADS@
threads-batch = @THREADS_BATCH@
;
; parallel = number of server slots (concurrent requests). Default -1 = auto,
; which sizes the slot count from the available resources. Set a fixed value to
; cap/raise concurrency explicitly; each loaded model gets its own slot pool.
parallel     = -1

; =============================================================================
; Per-model sampling presets. These are each model's OFFICIAL recommendation,
; gathered from the model cards on hf-mirror.com (Hugging Face mirror) and
; modelscope.cn. Only values that DIFFER from llama.cpp defaults are written.
; llama.cpp defaults (omitted when equal): temp 0.80 / top-k 40 / top-p 0.95 /
;   min-p 0.05 / repeat-penalty 1.00.
; chat-template is omitted -> the GGUF built-in template is used automatically.
;
; dspark = DSpark speculative-decoding DRAFT model (LiquidAI / OpenBMB),
; ENABLED below via model-draft + spec-type = draft-dspark.
; spec-draft-n-max follows the official DSpark block size:
;   LFM2.5-DSpark  = 9   (per LFM2.5 2.6B/8B-A1B-DSpark cards, block size 9)
;   MiniCPM5-DSpark = 7  (per MiniCPM5-2B-DSpark card, block size 7)
; llama.cpp default spec-draft-n-max is 3, so these are explicit overrides.
; spec-draft-n-min (default 0) and spec-draft-p-split (default 0.10) are left at
; llama.cpp defaults, matching official dspark examples which only set n-max.
; =============================================================================

; ============================ LFM2.5 (LiquidAI) ============================
; official: temp / top_k / repetition_penalty (top_p not specified)
; DSpark enabled, spec-draft-n-max = 9

[LFM2.5-1.2B-Instruct-Q8_0]
temp = 0.1
top-k = 50
repeat-penalty = 1.05
spec-type = draft-dspark
spec-draft-n-max = 9

[LFM2.5-2.6B-Q8_0]
temp = 0.1
top-k = 50
repeat-penalty = 1.1
spec-type = draft-dspark
spec-draft-n-max = 9
load-on-startup = true

[LFM2.5-8B-A1B-Q8_0]
temp = 0.2
top-k = 80
repeat-penalty = 1.05
spec-type = draft-dspark
spec-draft-n-max = 9

; ============================ MiniCPM5 (OpenBMB) ============================
; 2B: Think only, temp 1.0 / top_p 0.95 ; 1B: Think 0.9 / No-think 0.7
; 2B DSpark enabled, spec-draft-n-max = 7

[MiniCPM5-2B-Q8_0]
temp = 1.0
spec-type = draft-dspark
spec-draft-n-max = 7


[MiniCPM5-1B-Q8_0]
temp = 0.7

; ============================ Qwen3-ASR (Qwen) =============================
; official decoding = greedy (temperature ~ 0)

[Qwen3-ASR-0.6B-Q8_0]
temp = 0

; ============================ Qwen3 / Qwen3.8 ==============================
; Qwen3-4B: temp 0.6 / top_p 0.95 / top_k 20 / min_p 0
; Qwen3.8  : temp 1.0 / top_p 0.95 / top_k 20 / min_p 0

[Qwen3-4B-Q8_0]
temp = 0.6
top-k = 20
min-p = 0.0

[Qwen3.8-4B-Q8_0]
temp = 1.0
top-k = 20
min-p = 0.0

; ==================== QwenPaw-Flash (AgentScope, base Qwen3.5) =============
; official: temp 1.0 / top_p 0.95 / top_k 20 / presence_penalty 1.5

[QwenPaw-flash-2B-20260330-q8]
temp = 1.0
top-k = 20
presence-penalty = 1.5

[QwenPaw-flash-4B-20260330-q8]
temp = 1.0
top-k = 20
presence-penalty = 1.5

; ============== DeepSeek-V4-Pro-Qwen3.5-4B-MTP (Jackrong, base Qwen3.5) ====
; base model card gives no sampling params -> Qwen3.5 defaults used

[DeepSeek-V4-Pro-Qwen3.5-4B-MTP-Q8_0]
temp = 1.0
top-k = 20
min-p = 0.0

; ============================ Hy-MT2 (Tencent Hunyuan) =====================
; official 1.8B/7B: temp 0.7 / top_p 0.6 / top_k 20 / repeat 1.05

[Hy-MT2-1.8B-Q8_0]
temp = 0.7
top-p = 0.6
top-k = 20
repeat-penalty = 1.05

; ============================ Ling-3.0-tiny (inclusionAI) ==================
; official: temp 1.0 / top_p 0.95 / top_k 20

[Ling-3.0-tiny-Q8_0]
temp = 1.0
top-k = 20

; ==================== NeoHorse-1 (TokenRhythm, base Qwen3.5) ===============
; official: temp 1.0 / top_p 0.95 / top_k 20 / min_p 0 / presence_penalty 1.5

[NeoHorse-1-4B-Q8_0]
temp = 1.0
top-k = 20
min-p = 0.0
presence-penalty = 1.5

; ============================ Spark-X2.5 (iFlytek) =========================
; official: temp 1.0 / top_p 0.95 / top_k -1 (disabled -> 0 in llama.cpp)

[Spark-X2.5-1.7B-Q8_0]
temp = 1.0
top-k = 0

[Spark-X2.5-4B-Q8_0]
temp = 1.0
top-k = 0
